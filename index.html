<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>حقوق گزارش کار</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='13' fill='%2306100b' stroke='%2300ff88' stroke-width='4'/%3E%3Ctext x='32' y='48' font-family='Arial Black,Arial,sans-serif' font-size='42' font-weight='900' fill='%2300ff88' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-subtle: #1a1a24;
      --card: #16161f;
      --card-hover: #2a2a3a;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --accent: #ff2d95;
      --accent2: #00d4aa;
      --accent3: #7b2cbf;
      --glass: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .bg-pattern {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(123, 44, 191, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0, 212, 170, 0.12), transparent),
        radial-gradient(ellipse 50% 30% at 50% 50%, rgba(255, 45, 149, 0.1), transparent);
      z-index: -1;
      animation: bgFloat 20s ease-in-out infinite;
    }
    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }
    .grid-overlay {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1; opacity: 0.3;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      position: relative; z-index: 1;
    }
    h2 {
      text-align: center; margin: 0 0 24px; font-size: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; margin-bottom: 24px; }
    input, select {
      background: var(--glass); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px; color: var(--text); font-size: 14px; width: 100%;
    }
    select option { background: var(--card); color: var(--text); }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border: none; border-radius: 12px; padding: 10px 20px; color: white;
      font-weight: 600; font-size: 14px; cursor: pointer;
    }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px 0; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .action-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; color: var(--muted); font-size: 12px; cursor: pointer;
    }
    .total { text-align: right; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
    .total-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .total-value {
      font-size: 28px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #welcome {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
      background: linear-gradient(180deg, #12121c 0%, #0a0a0f 60%, #16161f 100%);
      cursor: pointer; transition: transform 0.9s cubic-bezier(0.76, 0, 0.24, 1);
    }
    #welcome.hide { transform: translateY(-101%); }
    #welcome .welcome-text {
      font-size: 42px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #welcome .welcome-sub { color: var(--muted); font-size: 14px; }
    #welcomeName {
      background: var(--glass); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 16px; color: var(--text); font-size: 15px; width: 240px; text-align: center;
    }
    .welcome-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border: none; border-radius: 12px; padding: 10px 34px; color: white; font-weight: 700; cursor: pointer;
    }
    .player-row { margin-bottom: 14px; }
    #fwDisplay { font-size: 13px; color: #ff7b7b; margin-top: 6px; font-weight: 600; }
    #playerDisplay { font-size: 15px; color: var(--text); margin-bottom: 6px; font-weight: 600; }
    .powered { margin-top: 14px; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--muted); }
    .next-btn { background: linear-gradient(135deg, var(--accent2), #00805f); width: 100%; font-size: 15px; padding: 12px 20px; }
    .next-row, .history-toggle-row { margin-top: 14px; text-align: center; }
    .history-toggle-btn { background: linear-gradient(135deg, var(--accent2), var(--accent3)); width: 100%; }
    .history { display: none; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }
    .history.open { display: block; }
    .history-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .history-title { font-size: 14px; font-weight: 700; }
    .history-clear { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
    #historyList { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
    .history-item { display: flex; flex-direction: column; background: var(--glass); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
    .history-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .history-player { font-weight: 700; }
    .history-date { font-size: 11px; color: var(--muted); }
    .history-amount { font-weight: 700; color: var(--accent2); white-space: nowrap; }
    .history-del { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 4px 9px; border-radius: 7px; cursor: pointer; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat-card { background: var(--glass); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
    .stat-num { font-size: 16px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .price-toggle-row { margin-bottom: 10px; text-align: center; }
    .price-toggle-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 12px; padding: 6px 16px; border-radius: 9px; cursor: pointer; }
    .price-editor { display: none; margin-bottom: 14px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--glass); }
    .price-editor.open { display: block; }
    .price-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .price-name { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .price-row input { max-width: 160px; padding: 7px 10px; font-size: 13px; }
    .price-add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin: 10px 0; padding-top: 10px; border-top: 1px dashed var(--border); }
    .price-actions { display: flex; gap: 8px; margin-top: 6px; }
    .price-actions button { flex: 1; font-size: 13px; }
    .price-reset { background: transparent !important; border: 1px solid var(--border) !important; color: var(--muted) !important; }
    .history-empty { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0; }
    .history-items { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 4px; }
    .history-line { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .history-line span:last-child { color: var(--text); font-weight: 600; }
    .creator { margin-top: 20px; text-align: center; }
    .creator a { display: inline-block; text-decoration: none; font-size: 13px; color: var(--muted); border: 1px solid var(--border); background: var(--glass); border-radius: 10px; padding: 8px 18px; }
    .subleader-box {
      display: flex; align-items: center; gap: 10px; margin-top: 10px;
      padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--glass); cursor: pointer;
    }
    .subleader-box.active { border-color: rgba(0, 212, 170, 0.45); }
    .subleader-box input { width: 20px; height: 20px; accent-color: var(--accent2); cursor: pointer; }
    .subleader-title { font-size: 14px; font-weight: 700; display: block; }
    .subleader-hint { font-size: 11px; color: var(--muted); }
    .form.disabled { opacity: 0.4; pointer-events: none; }
    @media (max-width: 480px) { .form { grid-template-columns: 1fr; } button { width: 100%; } }
  </style>
</head>
<body>
  <div id="welcome">
    <div class="welcome-text" id="welcomeText">خوش اومدی</div>
    <input id="welcomeName" placeholder="اسمت رو بنویس..." onkeydown="if(event.key==='Enter')submitWelcomeName()">
    <button class="welcome-btn" id="welcomeBtn" onclick="submitWelcomeName()">ورود</button>
    <div class="welcome-sub" id="welcomeSub">اسمت رو بنویس و ورود رو بزن</div>
  </div>
  <div class="bg-pattern"></div>
  <div class="grid-overlay"></div>
  <div class="container">
    <h2>حقوق گزارش کار</h2>
    <div class="player-row" id="playerRow">
      <input id="playerName" placeholder="نام پلیر" oninput="updatePlayerName()">
      <label class="subleader-box" id="subleaderBox">
        <input type="checkbox" id="subleaderCheck" onchange="onSubleaderChange()">
        <span>
          <span class="subleader-title">پلیر سابلیدر</span>
          <span class="subleader-hint">حقوق ثابت ۸٬۵۰۰٬۰۰۰ — هر FW برابر ۱٬۵۰۰٬۰۰۰ کسر</span>
        </span>
      </label>
    </div>
    <div class="form" id="taskForm">
      <select id="taskName" onchange="updatePrice()">
        <option value="Mini RP">Mini RP</option>
        <option value="RP">RP</option>
        <option value="GST[SS]">GST[SS]</option>
        <option value="Gasht">Gasht</option>
        <option value="Put Fire">Put Fire</option>
        <option value="Shift">Shift</option>
      </select>
      <input type="number" id="pricePerUnit" placeholder="پول هر کار">
      <input type="number" id="quantity" placeholder="تعداد">
      <button onclick="addRow()">افزودن</button>
    </div>
    <div class="price-toggle-row">
      <button class="price-toggle-btn" onclick="togglePriceEditor()">ویرایش قیمت‌ها</button>
    </div>
    <div class="price-editor" id="priceBox">
      <div id="priceRows"></div>
      <div class="price-add">
        <input id="newTaskName" placeholder="نام کار جدید">
        <input type="number" id="newTaskPrice" placeholder="قیمت" min="0">
        <button onclick="addCustomTask()">افزودن کار</button>
      </div>
      <div class="price-actions">
        <button onclick="savePrices()">ذخیره قیمت‌ها</button>
        <button class="price-reset" onclick="resetPrices()">بازگشت به پیش‌فرض</button>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>کار</th><th>پول هر واحد</th><th>تعداد</th><th>مجموع</th><th></th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="fw-row" style="margin-bottom:6px;margin-top:10px">
      <input type="number" id="fwCount" placeholder="تعداد FW" min="0" oninput="onFwChange()">
    </div>
    <div class="total">
      <div class="total-label">حقوق کل</div>
      <div id="playerDisplay"></div>
      <div class="total-value" id="total">۰</div>
      <div id="fwDisplay"></div>
      <div class="total-label" id="netLabel" style="display:none">مبلغ نهایی</div>
      <div class="total-value" id="netTotal" style="display:none">۰</div>
    </div>
    <div class="next-row">
      <button class="next-btn" onclick="nextPlayer()">تموم شد بریم پلیر بعدی</button>
    </div>
    <div class="history-toggle-row">
      <button class="history-toggle-btn" onclick="toggleHistory()">تاریخچه حقوق‌ها</button>
    </div>
    <div class="history" id="historyBox">
      <div class="history-head">
        <div class="history-title">حقوق‌های حساب‌شده قبلی</div>
        <button class="history-clear" onclick="clearHistory()">پاک کردن همه</button>
      </div>
      <div class="stats">
        <div class="stat-card"><div class="stat-num" id="statTotal">۰</div><div class="stat-lbl">مجموع پرداخت‌شده</div></div>
        <div class="stat-card"><div class="stat-num" id="statCount">۰</div><div class="stat-lbl">تعداد محاسبات</div></div>
        <div class="stat-card"><div class="stat-num" id="statTop">—</div><div class="stat-lbl">پرکارترین پلیر</div></div>
      </div>
      <div class="history-search-row" style="margin-bottom:10px">
        <input id="historySearch" placeholder="سرچ نام پلیر..." oninput="renderHistory()">
      </div>
      <div id="historyList"></div>
    </div>
    <div class="creator"><a href="https://t.me/ttafavot" target="_blank" rel="noopener">سازنده</a></div>
    <div class="powered">Powered By DAMAS</div>
  </div>
<script>
const SUBLEADER_BASE = 8500000;
const SUBLEADER_FW = 1500000;
const defaultPrices = { 'Mini RP': 200000, 'RP': 500000, 'GST[SS]': 300000, 'Gasht': 350000, 'Shift': 50000, 'Put Fire': 35000 };

function readStore(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
  catch (e) { return fallback; }
}
function loadPrices() {
  return { ...defaultPrices, ...readStore('customTaskPrices', {}), ...readStore('customTasks', {}) };
}
function rebuildTaskPrices() {
  taskPrices = { ...defaultPrices, ...readStore('customTaskPrices', {}), ...readStore('customTasks', {}) };
}
let taskPrices = loadPrices();
function isSubleader() { return document.getElementById('subleaderCheck').checked; }
function onSubleaderChange() {
  const on = isSubleader();
  document.getElementById('subleaderBox').classList.toggle('active', on);
  document.getElementById('taskForm').classList.toggle('disabled', on);
  updateTotal();
  autoSaveHistory();
}
function renderTaskOptions(keep) {
  const select = document.getElementById('taskName');
  const current = keep || select.value;
  select.innerHTML = '';
  Object.keys(taskPrices).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    select.appendChild(opt);
  });
  if (taskPrices[current] !== undefined) select.value = current;
}
function togglePriceEditor() {
  const box = document.getElementById('priceBox');
  box.classList.toggle('open');
  if (box.classList.contains('open')) renderPriceEditor();
}
function renderPriceEditor() {
  const wrap = document.getElementById('priceRows');
  const customs = readStore('customTasks', {});
  wrap.innerHTML = '';
  Object.keys(taskPrices).forEach(name => {
    const isCustom = customs[name] !== undefined;
    const row = document.createElement('div');
    row.className = 'price-row';
    row.innerHTML = '<span class="price-name">' + name + '</span>' +
      '<input type="number" min="0" value="' + (taskPrices[name] || 0) + '" data-task="' + name + '">' +
      (isCustom ? '<button class="action-btn" onclick="deleteCustomTask(\'' + name.replace(/'/g, "\\'") + '\')">حذف</button>' : '');
    wrap.appendChild(row);
  });
}
function savePrices() {
  const inputs = document.querySelectorAll('#priceRows input[data-task]');
  const overrides = {};
  const customs = readStore('customTasks', {});
  inputs.forEach(inp => {
    const v = parseFloat(inp.value);
    if (isNaN(v) || v < 0) return;
    const name = inp.dataset.task;
    if (defaultPrices[name] !== undefined) overrides[name] = v;
    else customs[name] = v;
  });
  try {
    localStorage.setItem('customTaskPrices', JSON.stringify(overrides));
    localStorage.setItem('customTasks', JSON.stringify(customs));
  } catch (e) {}
  rebuildTaskPrices(); renderTaskOptions(); updatePrice();
  document.getElementById('priceBox').classList.remove('open');
}
function addCustomTask() {
  const name = (document.getElementById('newTaskName').value || '').trim();
  const price = parseFloat(document.getElementById('newTaskPrice').value);
  if (!name || isNaN(price) || price < 0) return;
  if (taskPrices[name] !== undefined) return;
  const customs = readStore('customTasks', {});
  customs[name] = price;
  try { localStorage.setItem('customTasks', JSON.stringify(customs)); } catch (e) {}
  rebuildTaskPrices(); renderTaskOptions(name); renderPriceEditor(); updatePrice();
  document.getElementById('newTaskName').value = '';
  document.getElementById('newTaskPrice').value = '';
}
function deleteCustomTask(name) {
  const customs = readStore('customTasks', {});
  delete customs[name];
  try { localStorage.setItem('customTasks', JSON.stringify(customs)); } catch (e) {}
  rebuildTaskPrices(); renderTaskOptions(); renderPriceEditor(); updatePrice();
}
function resetPrices() {
  taskPrices = { ...defaultPrices };
  try { localStorage.removeItem('customTaskPrices'); localStorage.removeItem('customTasks'); } catch (e) {}
  renderTaskOptions(); renderPriceEditor(); updatePrice();
}
function updatePrice() {
  const select = document.getElementById('taskName');
  const priceInput = document.getElementById('pricePerUnit');
  priceInput.value = taskPrices[select.value] !== undefined ? taskPrices[select.value] : '';
}
let tbody = document.querySelector('#tableBody');
let totalSpan = document.getElementById('total');
function addRow() {
  if (isSubleader()) return;
  let name = document.getElementById('taskName').value;
  let price = parseFloat(String(document.getElementById('pricePerUnit').value || '').replace(/,/g, '')) || 0;
  let qty = parseInt(document.getElementById('quantity').value) || 0;
  if (!name || qty <= 0) return;
  let subtotal = price * qty;
  let tr = document.createElement('tr');
  tr.innerHTML = '<td>' + name + '</td><td>' + price.toLocaleString() + '</td><td>' + qty + '</td><td>' + subtotal.toLocaleString() + '</td><td><button class="action-btn" onclick="deleteRow(this)">حذف</button></td>';
  tbody.appendChild(tr);
  updateTotal(); updatePrice();
  document.getElementById('quantity').value = '';
  autoSaveHistory();
}
function deleteRow(btn) {
  tbody.removeChild(btn.parentNode.parentNode);
  updateTotal(); autoSaveHistory();
}
function nextPlayer() {
  tbody.innerHTML = '';
  document.getElementById('quantity').value = '';
  document.getElementById('fwCount').value = '';
  document.getElementById('playerName').value = '';
  document.getElementById('subleaderCheck').checked = false;
  onSubleaderChange();
  updatePlayerName(); updatePrice(); updateTotal();
  document.getElementById('playerName').focus();
}
function getFwCount() { return Math.max(0, parseInt(document.getElementById('fwCount').value) || 0); }
function computeTotals() {
  const fw = getFwCount();
  if (isSubleader()) {
    const deduction = fw * SUBLEADER_FW;
    return { gross: SUBLEADER_BASE, fw: fw, deduction: deduction, net: Math.max(0, SUBLEADER_BASE - deduction), subleader: true };
  }
  let gross = 0;
  tbody.querySelectorAll('tr').forEach(r => { gross += parseFloat((r.cells[3].innerText || '').replace(/,/g, '')) || 0; });
  const rate = Math.min(fw * 0.10, 1);
  const deduction = Math.round(gross * rate);
  return { gross: gross, fw: fw, deduction: deduction, net: gross - deduction, subleader: false };
}
function updateTotal() {
  const t = computeTotals();
  totalSpan.innerText = t.gross.toLocaleString();
  const fwDisplay = document.getElementById('fwDisplay');
  const netLabel = document.getElementById('netLabel');
  const netTotal = document.getElementById('netTotal');
  if (t.fw > 0 && t.gross > 0) {
    fwDisplay.innerText = t.subleader
      ? ('کسر سابلیدر FW (' + t.fw + ' × ۱٬۵۰۰٬۰۰۰): ' + t.deduction.toLocaleString())
      : ('کسر FW (' + t.fw + ' × ۱۰٪): ' + t.deduction.toLocaleString());
    netLabel.style.display = 'block';
    netTotal.style.display = 'block';
    netTotal.innerText = t.net.toLocaleString();
  } else {
    fwDisplay.innerText = '';
    netLabel.style.display = 'none';
    netTotal.style.display = 'none';
  }
}
function onFwChange() { updateTotal(); autoSaveHistory(); }
function updatePlayerName() {
  const name = document.getElementById('playerName').value.trim();
  document.getElementById('playerDisplay').innerText = name ? ('پلیر: ' + name + (isSubleader() ? ' · سابلیدر' : '')) : '';
}
function getHistory() { try { return JSON.parse(localStorage.getItem('salaryHistory') || '[]'); } catch (e) { return []; } }
function setHistory(list) { localStorage.setItem('salaryHistory', JSON.stringify(list)); }
function getCurrentItems() {
  if (isSubleader()) return [{ name: 'سابلیدر (ثابت)', price: SUBLEADER_BASE.toLocaleString(), qty: '1', subtotal: SUBLEADER_BASE.toLocaleString() }];
  const items = [];
  tbody.querySelectorAll('tr').forEach(r => {
    items.push({ name: r.cells[0].innerText, price: r.cells[1].innerText, qty: r.cells[2].innerText, subtotal: r.cells[3].innerText });
  });
  return items;
}
function autoSaveHistory() {
  const t = computeTotals();
  if (!t.subleader && t.net <= 0) return;
  if (t.subleader && t.gross <= 0) return;
  const player = document.getElementById('playerName').value.trim() || 'بدون نام';
  const now = new Date();
  const dateStr = now.toLocaleDateString('fa-IR') + ' ' + now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
  const list = getHistory();
  list.unshift({ player: player, total: t.net, gross: t.gross, fw: t.fw, deduction: t.deduction, date: dateStr, items: getCurrentItems(), subleader: t.subleader });
  setHistory(list);
  if (document.getElementById('historyBox').classList.contains('open')) renderHistory();
}
function toggleHistory() {
  const box = document.getElementById('historyBox');
  box.classList.toggle('open');
  if (box.classList.contains('open')) renderHistory();
}
function renderStats() {
  const list = getHistory();
  const sum = list.reduce((s, it) => s + (Number(it.total) || 0), 0);
  document.getElementById('statTotal').innerText = sum.toLocaleString();
  document.getElementById('statCount').innerText = list.length.toLocaleString();
  const counts = {};
  list.forEach(it => { const p = it.player || 'بدون نام'; counts[p] = (counts[p] || 0) + 1; });
  let top = '—', topN = 0;
  Object.keys(counts).forEach(p => { if (counts[p] > topN) { topN = counts[p]; top = p; } });
  document.getElementById('statTop').innerText = top === '—' ? '—' : top + ' (' + topN + ')';
}
function renderHistory() {
  renderStats();
  const box = document.getElementById('historyList');
  const q = (document.getElementById('historySearch').value || '').trim();
  const list = getHistory();
  if (!list.length) { box.innerHTML = '<div class="history-empty">هنوز حقوقی ذخیره نشده</div>'; return; }
  const filtered = list.map((item, idx) => Object.assign({}, item, { _idx: idx })).filter(item => !q || (item.player || '').includes(q));
  if (!filtered.length) { box.innerHTML = '<div class="history-empty">موردی برای این اسم پیدا نشد</div>'; return; }
  box.innerHTML = '';
  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'history-item';
    const fwTag = (item.fw > 0) ? '<span class="history-date">FW: ' + item.fw + ' (کسر ' + Number(item.deduction || 0).toLocaleString() + ')</span>' : '';
    let itemsHtml = '';
    if (item.items && item.items.length) {
      itemsHtml = '<div class="history-items">' + item.items.map(it =>
        '<div class="history-line"><span>' + it.name + ' × ' + it.qty + '</span><span>' + it.subtotal + '</span></div>'
      ).join('') + '</div>';
    }
    div.innerHTML =
      '<div class="history-top"><div class="history-info"><span class="history-player">' + item.player + (item.subleader ? ' · سابلیدر' : '') +
      '</span><span class="history-date">' + item.date + '</span>' + fwTag +
      '</div><span class="history-amount">' + Number(item.total).toLocaleString() +
      '</span><button class="history-del" onclick="deleteHistoryItem(' + item._idx + ')">حذف</button></div>' + itemsHtml;
    box.appendChild(div);
  });
}
function deleteHistoryItem(index) { const list = getHistory(); list.splice(index, 1); setHistory(list); renderHistory(); }
function clearHistory() { setHistory([]); renderHistory(); }
renderTaskOptions(); updatePrice();
(function initSavedName() {
  let saved = '';
  try { saved = localStorage.getItem('savedMyName') || localStorage.getItem('savedPlayerName') || ''; } catch (e) {}
  saved = (saved || '').trim();
  if (saved) { try { localStorage.setItem('savedMyName', saved); } catch (e) {} }
  if (saved) {
    document.getElementById('welcomeText').innerText = 'خوش اومدی ' + saved;
    document.getElementById('welcomeName').style.display = 'none';
    document.getElementById('welcomeBtn').style.display = 'none';
    document.getElementById('welcomeSub').innerText = 'در حال ورود...';
    setTimeout(closeWelcome, 1400);
  } else {
    setTimeout(function () { const wi = document.getElementById('welcomeName'); if (wi) wi.focus(); }, 300);
  }
})();
let welcomeClosed = false;
function closeWelcome() {
  if (welcomeClosed) return;
  welcomeClosed = true;
  const w = document.getElementById('welcome');
  if (!w) return;
  w.classList.add('hide');
  setTimeout(function () { const el = document.getElementById('welcome'); if (el) el.remove(); }, 1000);
}
function submitWelcomeName() {
  const name = (document.getElementById('welcomeName').value || '').trim();
  if (name) {
    try { localStorage.setItem('savedMyName', name); } catch (e) {}
    document.getElementById('welcomeText').innerText = 'خوش اومدی ' + name;
  }
  setTimeout(closeWelcome, 900);
}
</script>
